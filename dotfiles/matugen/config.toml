[config]
mode="dark"

[templates.kitty]
input_path="~/resources/dotfiles/matugen/templates/kitty.conf"
output_path="~/resources/dotfiles/kitty/current-theme.conf"
post_hook="killall -SIGUSR1 kitty"

[templates.yazi]
input_path="~/resources/dotfiles/matugen/templates/yazi.toml"
output_path="~/resources/dotfiles/yazi/theme.toml"

[templates.obsidian]
input_path="~/resources/dotfiles/matugen/templates/obsidian.css"
output_path="~/resources/dotfiles/matugen/outputs/obsidianSnippet.css"

[templates.prism]
input_path="~/resources/dotfiles/matugen/templates/prism.json"
output_path="~/resources/dotfiles/matugen/outputs/prismTheme.json"
